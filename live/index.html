<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="favicon.svg">
    <title>NatzTV - Stream</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://natztv.my.id">

    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/controls.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/shaka-player.ui.js"></script>
</head>
<body>

    <header class="topbar">
        <div class="brand">
            <span class="logo-icon">▶</span> NatzTV
            <span class="badge-live">LIVE</span>
        </div>
        <div class="now-playing" id="topbar-title">Memuat...</div>
    </header>

    <main class="app-layout">
        <aside class="sidebar">
            <div class="search-box">
                <input type="text" id="search" placeholder="Cari tayangan..." autocomplete="off" aria-label="Cari tayangan">
            </div>
            <ul id="channel-list" class="channel-list"></ul>
        </aside>

        <section class="player-section" style="min-width: 0; display: flex; flex-direction: column;">
            <div class="video-container" id="videoContainer" style="width: 100%; position: relative; display: flex; flex: 1;">
                
                <video id="video" autoplay muted playsinline style="width: 100%; height: 100%; max-height: 100vh; object-fit: contain; background: #000;"></video>
                
                <div class="hint-text" id="unmuteHint">Ketuk layar untuk mengaktifkan suara</div>

                <div id="toast" class="toast-msg"></div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
