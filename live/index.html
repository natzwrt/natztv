<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>NatzTV - Stream Player</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/shaka-player.compiled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="filter-pills-container">
                <div class="category-switcher-container">
                    <button id="prev-category-btn" class="switcher-arrow-btn">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div id="current-category-box" class="current-category-box">Memuat...</div>
                    <button id="next-category-btn" class="switcher-arrow-btn">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
            <div class="channel-list" id="channel-list"></div>
        </aside>

        <main class="player-container">
            
            <div id="branding-screen" class="branding-screen">
                <img src="natztv.webp" alt="natztv Logo" class="branding-img" onerror="this.style.display='none'">
                <h2>Selamat datang di natztv</h2>
                <h3>Tempat kamu streaming gratis tanpa ribet</h3>
                <p>Silakan pilih channel untuk menonton</p>
            </div>

            <div id="main-player-wrapper" class="main-player-wrapper hidden">
                <div class="video-wrapper" id="video-wrapper">
                    
                    <video id="video-player" crossorigin="anonymous" playsinline webkit-playsinline></video>
                    
                    <div id="custom-controls" class="custom-controls-bar">
                        <div class="controls-row">
                            
                            <button id="play-btn" class="ctrl-btn"><i class="fa-solid fa-play"></i></button>
                            <div class="volume-box">
                                <button id="mute-btn" class="ctrl-btn"><i class="fa-solid fa-volume-high"></i></button>
                                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" class="vol-slider">
                            </div>
                            <div class="live-badge"><span class="live-dot"></span> LIVE</div>

                            <div class="flex-spacer"></div>

                            <div class="quality-selector-box">
                                <button id="quality-btn" class="ctrl-btn quality-btn-wrapper">
                                    <span id="quality-label" class="quality-badge">Auto</span>
                                    <i class="fa-solid fa-gear"></i> 
                                </button>
                                <div id="quality-menu" class="quality-dropdown-menu hidden"></div>
                            </div>

                            <div id="subtitle-box" class="subtitle-selector-box" style="display: none;">
                                <button id="subtitle-btn" class="ctrl-btn">
                                    <i class="fa-solid fa-closed-captioning"></i>
                                </button>
                                <div id="subtitle-menu" class="quality-dropdown-menu hidden"></div>
                            </div>

                            <button id="fullscreen-btn" class="ctrl-btn"><i class="fa-solid fa-expand"></i></button>
                        </div>
                    </div>

                    <div id="loading-overlay" class="loading-overlay hidden">
                        <div class="spinner"></div>
                    </div>

                    <div id="error-overlay" class="error-overlay hidden">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <h3>Siaran Tidak Tersedia</h3>
                        <p id="error-message">Error Code: -</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
